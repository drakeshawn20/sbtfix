name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/sbtfix.app sbtfix.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sbtfix.zip --title "$GITHUB_REF_NAME" --generate-notes
