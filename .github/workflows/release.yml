name: Release

# Push a tag like v1.2.0 to publish a release. The notes come from the matching
# "## 1.2.0" section of CHANGELOG.md, followed by .github/release-footer.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          cat .github/release-footer.md >> notes.md
      - name: Stamp version
        run: |
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Resources/Info.plist
      - name: Test
        run: swift test
      - name: Build app
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/sbtfix.app sbtfix.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sbtfix.zip --title "sbtfix $GITHUB_REF_NAME" --notes-file notes.md
